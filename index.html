<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEONIS — Os Que Voltam</title>
<style>
  @font-face { font-family: 'Press Start 2P'; src: url('./fonts/PressStart2P.ttf') format('truetype'); }
  @font-face { font-family: 'VT323'; src: url('./fonts/VT323.ttf') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1114; }
  body { font-family: 'VT323', monospace; color: #e8e2d0; user-select: none; }

  #game2d {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    z-index: 0; background: #0c1114;
  }
  #ui-root { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .clickable { pointer-events: auto; }
  .clickable * { pointer-events: auto; }

  .ol { text-shadow: 2px 2px 0 #000; }
  .btn {
    font-family: 'Press Start 2P', monospace; font-size: 11px;
    background: #3a4750; color: #fff; border: 3px solid #000;
    box-shadow: inset -3px -3px 0 #262f36, inset 3px 3px 0 #55666f;
    padding: 12px 18px; cursor: pointer; text-shadow: 2px 2px 0 #000;
  }
  .btn:hover { background: #4a5a64; }
  .btn:active { box-shadow: inset 3px 3px 0 #262f36; }
  .btn.sec { background: #2a333a; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .gold { color: #ffe08a; }

  /* ================= TÍTULO ================= */
  #title { position: absolute; inset: 0; background: #000; text-align: center; z-index: 40; }
  #title canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
  #title .logo { position: relative; z-index: 2; }
  #title h1 {
    font-family: 'Press Start 2P', monospace; font-size: 52px; color: #ffe08a;
    text-shadow: 4px 4px 0 #000, 0 0 24px rgba(255, 200, 60, 0.35);
    letter-spacing: 8px; margin-top: 9vh;
  }
  #title h2 {
    font-family: 'Press Start 2P', monospace; font-size: 13px; color: #e8e2d0;
    text-shadow: 2px 2px 0 #000; letter-spacing: 6px; margin-top: 14px;
  }
  .tmenu { margin-top: 7vh; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .tbtn { width: 320px; }
  .tfoot { position: absolute; bottom: 14px; width: 100%; font-size: 17px; color: #9aa8b0; text-shadow: 1px 1px 0 #000; }

  /* ================= INTRO ================= */
  #intro {
    position: absolute; inset: 0; z-index: 39; display: none;
    background: transparent; text-align: center;
  }
  #intro.on { display: block; }
  #intro-chap {
    font-family: 'Press Start 2P', monospace; font-size: 15px; color: #ffe08a;
    text-shadow: 3px 3px 0 #000; margin-top: 12vh; opacity: 0; transition: opacity .8s;
  }
  #intro-sub {
    font-size: 24px; color: #e8e2d0; text-shadow: 2px 2px 0 #000;
    max-width: 720px; margin: 18px auto 0; line-height: 1.2;
  }
  #intro-card {
    margin-top: 8vh; display: none;
  }
  #intro.on.finished #intro-card { display: block; }
  #intro-card h3 { font-family: 'Press Start 2P', monospace; font-size: 16px; color: #8fe08f; text-shadow: 3px 3px 0 #000; }
  #intro-card p { font-size: 22px; margin: 12px auto; max-width: 640px; text-shadow: 2px 2px 0 #000; }
  #intro-skip { position: absolute; top: 16px; right: 16px; font-size: 9px; padding: 8px 12px; }

  /* ================= CRIAÇÃO ================= */
  #creation {
    position: absolute; inset: 0; z-index: 38; background: #10171c;
    overflow-y: auto; padding: 30px 0 60px; text-align: center;
  }
  #creation h1 { font-family: 'Press Start 2P', monospace; font-size: 30px; color: #ffe08a; text-shadow: 4px 4px 0 #000; }
  #creation .sub { font-size: 20px; color: #9aa8b0; margin: 10px 0 22px; line-height: 1.25; }
  #creation .sect { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #7a8a94; margin: 26px 0 12px; text-shadow: 2px 2px 0 #000; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 1060px; margin: 0 auto; padding: 0 16px; }
  .rcard, .wcard {
    background: #1a2228; border: 3px solid #000; box-shadow: inset 0 0 0 2px #2c3840;
    width: 158px; padding: 12px 8px; cursor: pointer; text-align: center;
  }
  .rcard:hover, .wcard:hover { background: #222c34; }
  .rcard.sel, .wcard.sel { border-color: #ffe08a; box-shadow: inset 0 0 0 2px #6a5a2a, 0 0 12px rgba(255, 224, 138, 0.35); }
  .rcard canvas { image-rendering: pixelated; }
  .nm { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fff; margin: 8px 0 4px; }
  .bn { font-size: 16px; color: #8fe08f; margin-bottom: 4px; }
  .ds { font-size: 15px; color: #9aa8b0; line-height: 1.15; }
  .ico { font-size: 18px; }
  .wcard { width: 240px; text-align: left; }
  .namerow { margin: 26px 0 4px; }
  .namerow input {
    font-family: 'VT323', monospace; font-size: 22px; color: #ffe08a;
    background: #0c1114; border: 3px solid #000; box-shadow: inset 0 0 0 2px #2c3840;
    padding: 10px 14px; width: 320px; text-align: center; outline: none;
  }
  .btnrow { margin-top: 20px; }
  .hint { font-size: 16px; color: #7a8a94; max-width: 640px; margin: 14px auto 0; line-height: 1.2; }
  .center { text-align: center; }

  /* ================= HUD ================= */
  #hudbottom {
    position: absolute; left: 18px; bottom: 16px; width: 300px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .barwrap {
    width: 100%; height: 16px; background: #14181c;
    border: 3px solid #000; box-shadow: inset 0 0 0 2px #2c3840;
  }
  .barfill { height: 100%; width: 100%; }
  #hpfill { background: linear-gradient(#e05a4a, #a02818); box-shadow: inset 0 3px 0 rgba(255,255,255,0.25); }
  #stafill { background: linear-gradient(#e8c84a, #a08218); box-shadow: inset 0 3px 0 rgba(255,255,255,0.25); }
  #mountfill { background: linear-gradient(#6ac24a, #2a8a1a); box-shadow: inset 0 3px 0 rgba(255,255,255,0.25); }
  #mountwrap { display: none; }
  #mountlbl { font-size: 16px; color: #b0e8a0; text-shadow: 1px 1px 0 #000; margin-top: 2px; }
  #lvlrow { font-size: 18px; color: #e8e2d0; text-shadow: 1px 1px 0 #000; }

  #minimapwrap { position: absolute; right: 16px; top: 14px; text-align: right; }
  #regionname { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fff; margin-bottom: 6px; }
  #minimap {
    border: 3px solid #000; box-shadow: inset 0 0 0 2px #2c3840, 4px 4px 0 rgba(0,0,0,0.4);
    image-rendering: pixelated; background: #0c1114;
  }

  #questbox {
    position: absolute; left: 18px; top: 14px; max-width: 360px;
    background: rgba(10, 14, 18, 0.82); border-left: 4px solid #ffe08a; padding: 10px 14px;
  }
  #questbox .qt { font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffe08a; margin-bottom: 6px; }
  #questbox .qd { font-size: 18px; color: #cfd8dc; line-height: 1.15; }

  #feed { position: absolute; left: 50%; transform: translateX(-50%); bottom: 120px; text-align: center; font-size: 19px; }
  #feed div { transition: opacity .6s; margin-top: 3px; }

  #prompt {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fff;
    background: rgba(10, 14, 18, 0.85); border: 2px solid #000; padding: 9px 14px; display: none;
  }

  #bossbar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: min(440px, 60vw); text-align: center;
  }
  #bossbar .bname { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ffd23a; margin-bottom: 6px; }
  #bossbar .bwrap { height: 12px; background: #14181c; border: 3px solid #000; box-shadow: inset 0 0 0 2px #2c3840; }
  #bossbar .bfill { height: 100%; width: 100%; background: linear-gradient(#ff4040, #a01818); box-shadow: inset 0 3px 0 rgba(255,255,255,0.25); }

  #victory {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(8, 6, 14, 0.88); z-index: 70;
  }
  #victory .vcard { text-align: center; max-width: 560px; padding: 30px; }
  #victory h1 { font-family: 'Press Start 2P', monospace; font-size: 24px; color: #ffd23a; text-shadow: 4px 4px 0 #000, 0 0 30px rgba(255,210,60,.4); margin-bottom: 20px; }
  #victory .vs { font-size: 22px; color: #e8e2d0; text-shadow: 2px 2px 0 #000; }
  #victory .vl { font-size: 19px; color: #9aa8b0; font-style: italic; margin: 14px 0 22px; line-height: 1.3; text-shadow: 2px 2px 0 #000; }
  #victory .vstats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 26px; }
  #victory .vstats div { background: #141b20; border: 3px solid #000; box-shadow: inset 0 0 0 2px #2c3840; padding: 8px 14px; }
  #victory .vstats span { display: block; font-size: 12px; color: #7a8a94; letter-spacing: 2px; }
  #victory .vstats b { font-size: 20px; color: #ffe08a; }

  #zonetitle {
    position: absolute; left: 0; right: 0; top: 26vh; text-align: center;
    font-family: 'Press Start 2P', monospace; font-size: 22px; color: #fff;
    opacity: 0; transition: opacity .7s; pointer-events: none;
  }

  .dmgnum {
    position: absolute; font-family: 'Press Start 2P', monospace; font-size: 11px;
    transition: transform .8s ease-out, opacity .8s ease-out;
  }

  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 8; box-shadow: inset 0 0 140px rgba(200,0,0,0); transition: box-shadow .18s; }

  .toast {
    position: fixed; left: 50%; top: 20vh; transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ffe08a;
    background: rgba(10, 14, 18, 0.92); border: 3px solid #000; box-shadow: inset 0 0 0 2px #4a4020;
    padding: 14px 20px; z-index: 60; max-width: 80vw; text-align: center; line-height: 1.5;
  }

  /* ================= PAINÉIS ================= */
  .panelwrap {
    position: absolute; inset: 0; background: rgba(5, 8, 10, 0.72);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .panel {
    background: #1a2228; border: 3px solid #000; box-shadow: inset 0 0 0 3px #2c3840, 8px 8px 0 rgba(0,0,0,0.5);
    padding: 26px 30px; max-width: 640px; max-height: 82vh; overflow-y: auto;
  }
  .panel h2 { font-family: 'Press Start 2P', monospace; font-size: 13px; color: #ffe08a; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
  .panel p { font-size: 19px; color: #9aa8b0; font-style: italic; margin-bottom: 12px; }
  .panel .stat { font-size: 19px; color: #cfd8dc; margin: 6px 0; }
  .panel .itemrow { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 10px 0; font-size: 20px; }
  .panel hr { border: none; border-top: 2px dashed #2c3840; margin: 14px 0; }
  .panel .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .skwrap { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .skcol { flex: 1; min-width: 130px; }
  .skhead { font-family: 'Press Start 2P', monospace; font-size: 9px; margin-bottom: 8px; text-shadow: 2px 2px 0 #000; }
  .sknode { background: #141b20; border: 2px solid #000; box-shadow: inset 0 0 0 1px #2c3840; padding: 7px 8px; margin-bottom: 6px; font-size: 15px; }
  .sknode b { font-size: 16px; color: #e8e2d0; }
  .sknode .ds { color: #9aa8b0; line-height: 1.1; margin: 3px 0; }
  .sknode .st { font-size: 13px; }
  .sknode.owned { box-shadow: inset 0 0 0 1px #2a5a2a; }
  .sknode.avail { cursor: pointer; box-shadow: inset 0 0 0 1px #6a5a2a; }
  .sknode.avail:hover { background: #222c34; }
  .sknode.lock { opacity: 0.55; }

  /* ================= DIÁLOGO ================= */
  #dialog {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    width: min(620px, 92vw); background: #1a2228; border: 3px solid #000;
    box-shadow: inset 0 0 0 3px #2c3840, 6px 6px 0 rgba(0,0,0,0.5);
    padding: 18px 22px; display: none; z-index: 55;
  }
  #dialog .drow { display: flex; align-items: center; gap: 16px; }
  #dialog .dface {
    width: 84px; height: 84px; flex: 0 0 auto;
    image-rendering: pixelated; border: 3px solid #000;
    box-shadow: inset 0 0 0 2px #46565f, 3px 3px 0 rgba(0,0,0,0.5);
  }
  #dialog .dbody { flex: 1; min-width: 0; }
  #dialog .dn { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ffe08a; margin-bottom: 8px; }
  #dialog .dt { font-size: 21px; color: #e8e2d0; line-height: 1.2; }
  #dialog .opt { font-size: 20px; color: #8fc7ff; margin-top: 10px; cursor: pointer; }
  #dialog .opt:hover { color: #ffe08a; }

  /* ================= MORTE ================= */
  #deathscreen {
    position: absolute; inset: 0; background: rgba(20, 4, 4, 0.88); z-index: 58;
    display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  #deathscreen h1 { font-family: 'Press Start 2P', monospace; font-size: 26px; color: #ff6a5a; text-shadow: 4px 4px 0 #000; margin-bottom: 20px; }
  #deathscreen p { font-size: 24px; color: #e8c8c0; line-height: 1.3; margin-bottom: 30px; }

  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: #0c1114; }
  ::-webkit-scrollbar-thumb { background: #3a4750; border: 2px solid #0c1114; }
</style>
</head>
<body>
  <canvas id="game2d"></canvas>
  <div id="vignette"></div>
  <div id="ui-root">
    <div id="intro">
      <div id="intro-chap"></div>
      <div id="intro-sub"></div>
      <div id="intro-card">
        <h3>REGRA Nº 1 DO BRAVO</h3>
        <p>Quem sai, volta. Quem volta, <b>volta trazendo</b>.</p>
        <p style="color:#9aa8b0">Sandbox aberto: todas as zonas liberadas. O nível é do conteúdo — o Umbigo espera os Nv.12+.</p>
        <button class="btn" id="intro-go">FORJAR SEU LEONIS</button>
      </div>
      <button class="btn sec" id="intro-skip">PULAR ›</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
